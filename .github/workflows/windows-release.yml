name: Windows update release

on:
  push:
    branches: [main]
    paths:
      - FileToGitHub.csproj
      - '*.cs'
      - '*.xaml'
      - installer/**
      - docs/legal/**
      - OCTOSHIP-GUIDE.md
      - SECURITY-OPERATIONS.md
      - .github/workflows/windows-release.yml
      - scripts/Publish-WindowsRelease.ps1
      - scripts/Publish-PreparedWindowsRelease.ps1
      - scripts/Build-WindowsInstaller.ps1
      - scripts/Install-InnoSetup.ps1
      - scripts/New-ReleaseSbom.ps1
      - verification/updates/**
      - verification/sbom/**
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: windows-update-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup compiler
        shell: pwsh
        run: ./scripts/Install-InnoSetup.ps1
      - name: Test and prepare the versioned Windows package
        shell: pwsh
        run: ./scripts/Publish-WindowsRelease.ps1 -PrepareRelease
      - id: version
        name: Read package version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath FileToGitHub.csproj
          "version=$([string]$project.Project.PropertyGroup.Version)" >> $env:GITHUB_OUTPUT
      - name: Attest Windows package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            installers/release-${{ steps.version.outputs.version }}/OctoShip-win-x64.zip
            installers/release-${{ steps.version.outputs.version }}/OctoShip-Setup-v${{ steps.version.outputs.version }}-win-x64.exe
            installers/release-${{ steps.version.outputs.version }}/OctoShip-win-x64-sbom.cdx.json
      - name: Publish attested Windows package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Publish-PreparedWindowsRelease.ps1
